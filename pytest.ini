[pytest]
minversion = 8.0

testpaths = tests
python_files = test_*.py
python_functions = test_*

addopts =
    -ra
    --tb=short
    --timeout=120
    --screenshot=only-on-failure
    --video=retain-on-failure
    --tracing=retain-on-failure

markers =
    web: Browser-driven UI test.
    recorded: Auto-generated via make record (Playwright codegen).
